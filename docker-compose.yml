# Generated by generate-compose.py --nodes 3. Do not hand-edit the
# pbsnode service blocks below; re-run the script to change the node count.
x-node-common: &node-common
  build:
    context: ./mom
    args:
      UBUNTU_BASE: ${UBUNTU_BASE}
  image: ghcr.io/noaa-gsl/dockerpbscluster/pbs-mom:${IMAGE_TAG}
  shm_size: '4g'
  user: admin
  volumes:
    - shared-vol:/home/admin
  depends_on:
    pbsserver:
      condition: service_started
    pbsfrontend:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "ssh", "-o", "StrictHostKeyChecking=no", "admin@localhost", "hostname"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  pbsfrontend:
    build:
      context: ./frontend
      args:
        UBUNTU_BASE: ${UBUNTU_BASE}
    image: ghcr.io/noaa-gsl/dockerpbscluster/pbs-frontend:${IMAGE_TAG}
    container_name: ${CLUSTER_NAME}-frontend
    shm_size: '4g'
    hostname: pbsfrontend
    user: admin
    volumes:
      - shared-vol:/home/admin
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ssh-ready"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s
  pbsserver:
    build:
      context: ./server
      args:
        UBUNTU_BASE: ${UBUNTU_BASE}
    image: ghcr.io/noaa-gsl/dockerpbscluster/pbs-server:${IMAGE_TAG}
    container_name: ${CLUSTER_NAME}-server
    shm_size: '4g'
    hostname: pbsserver
    user: admin
    volumes:
      - shared-vol:/home/admin
    depends_on:
      pbsfrontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pbs-server-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
  pbsnode1:
    <<: *node-common
    container_name: ${CLUSTER_NAME}-node1
    hostname: pbsnode1
    environment:
      - PBS_NODENAME=pbsnode1
  pbsnode2:
    <<: *node-common
    container_name: ${CLUSTER_NAME}-node2
    hostname: pbsnode2
    environment:
      - PBS_NODENAME=pbsnode2
  pbsnode3:
    <<: *node-common
    container_name: ${CLUSTER_NAME}-node3
    hostname: pbsnode3
    environment:
      - PBS_NODENAME=pbsnode3
volumes:
  shared-vol:
